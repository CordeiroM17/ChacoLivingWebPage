services:
  db:
    image: postgres:16-alpine
    container_name: sillones_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: sillones
      POSTGRES_PASSWORD: sillones
      POSTGRES_DB: sillones
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/1_schema.sql
      - ./sql/seed.sql:/docker-entrypoint-initdb.d/2_seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sillones -d sillones"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  db_data:
