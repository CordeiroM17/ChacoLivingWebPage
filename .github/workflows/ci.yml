name: CI

# Corre en cada PR hacia dev/main (el gate real, antes del merge) y en cada push
# a esas ramas (deja la insignia verde/roja en el historial después del merge).
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

# Un PR que recibe varios pushes seguidos cancela las corridas viejas.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      # Node 22 (LTS, satisface el rango de Vite 8) aunque la máquina local tenga
      # otra versión: el CI matchea lo que se despliega.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test:schemas
      - run: npm run build

  # ---------------------------------------------------------------------------
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sillones
          POSTGRES_PASSWORD: sillones
          POSTGRES_DB: sillones
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sillones"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Valores dummy: el backend levanta con estos y los tests firman su propio
      # JWT con crear_token(). No hay ningún secreto real en el CI.
      DATABASE_URL: postgresql://sillones:sillones@localhost:5432/sillones
      JWT_SECRET_KEY: ci-no-secreto
      GOOGLE_CLIENT_ID: ci.apps.googleusercontent.com
      ADMIN_EMAILS: ci@example.com
      UPLOADS_DIR: /tmp/ci-uploads
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12" # igual que backend/Dockerfile
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      # Smoke: atrapa errores de sintaxis y el RuntimeError de auth.py por env
      # faltante antes de correr nada más.
      - run: python -c "import app.main; print('import app.main OK')"
      # pytest se activa solo cuando la Fase 1 agrega backend/tests/.
      - name: pytest
        if: ${{ hashFiles('backend/tests/**/*.py') != '' }}
        run: pytest

  # ---------------------------------------------------------------------------
  # schema.sql + seed.sql tienen que aplicar en una base limpia: atrapa que
  # alguien toque models.py y se olvide de actualizar el SQL (que es la verdad
  # para las bases nuevas). Desde la Fase 1 este job también aplica cada
  # migración nueva dos veces para probar su idempotencia.
  sql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sillones
          POSTGRES_PASSWORD: sillones
          POSTGRES_DB: sillones
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sillones"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: sillones
    steps:
      - uses: actions/checkout@v4
      - name: Instalar psql
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client
      - name: schema.sql + seed.sql aplican en una base limpia
        run: |
          psql -v ON_ERROR_STOP=1 -h localhost -U sillones -d sillones -f sql/schema.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U sillones -d sillones -f sql/seed.sql
